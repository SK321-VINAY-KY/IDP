# ==============================================================================
# Docker Compose for IDP Project:
#   idp-pipeline: Document Processing & Navigation Extraction Pipeline
# ==============================================================================

services:
  idp-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idp-pipeline
    environment:
      - PYTHONPATH=/app
    env_file:
      - path: .env
        required: false
    volumes:
      - ./dataset:/app/dataset
      - ./dataset_output:/app/dataset_output
      - ./data:/app/data
      - ./logs:/app/logs
      - ./src:/app/src
      - paddle-cache:/root/.paddleocr
      - hf-cache:/root/.cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "run_extraction.py"]

volumes:
  paddle-cache:
    name: idp-paddle-cache
  hf-cache:
    name: idp-hf-cache
