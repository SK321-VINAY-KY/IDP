# Pre-commit hook configuration — ShellKode Code Development Framework
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
#
# Hooks enforced:
#   1. Ruff  — lint (replaces flake8/isort/pyupgrade) + format (replaces black)
#   2. detect-secrets — blocks accidental secret/key commits
#   3. Standard pre-commit checks — trailing whitespace, YAML/JSON validity, etc.

repos:
  # --- Standard file hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key          # block PEM/SSH private keys
      - id: no-commit-to-branch
        args: ["--branch", "main"]      # enforce: never commit directly to main

  # --- Ruff: lint + format (ShellKode standard) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: ["--fix"]                 # auto-fix safe lint violations
      - id: ruff-format                 # opinionated formatter (replaces black)

  # --- Secret scanning ---
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: >
          (?x)^(
            \.env\.example|
            .*\.md|
            .*test.*
          )$
